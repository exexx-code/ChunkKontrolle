name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      # LabyMod 3 API gibt es offiziell nicht mehr zum Download -> Kopie aus einem öffentlichen Addon, fest auf Commit + Prüfsumme
      - name: LabyMod-API laden
        run: |
          mkdir -p libs
          curl -sfLo libs/lm_api_mc1.8.9.jar https://raw.githubusercontent.com/Antimoxs/HyPlus/2c846b5ed3679cf1292120d026619aa5c69a7796/libs/lm_api_mc1.8.9.jar
          echo "54238fbdf7226a67b79165778591e770ec1037cec15e19dd5e3027e40f931020  libs/lm_api_mc1.8.9.jar" | sha256sum -c
      - run: set -o pipefail; gradle build --no-daemon 2>&1 | tee build.log
      - name: Fehler anzeigen
        if: failure()
        run: echo "::error::$(grep -E -A6 'error:|What went wrong|Could not' build.log | head -60 | sed -z 's/%/%25/g; s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: ChunkBugAddon
          path: build/libs/ChunkBugAddon-1.1.0.jar
      - name: Release mit der .jar
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.1.0-build-${{ github.run_number }}" build/libs/ChunkBugAddon-1.1.0.jar --title "Version 1.1.0 (Build ${{ github.run_number }})" --notes "Automatischer Build. Die .jar nach .minecraft/LabyMod/addons-1.8/ kopieren."
