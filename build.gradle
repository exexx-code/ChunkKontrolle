// LabyMod 3 Addon für 1.8.9 – Java 8, Gradle 6.8.3
// libs/lm_api_mc1.8.9.jar wird vom GitHub-Build automatisch geladen (siehe .github/workflows/build.yml).
buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://jitpack.io/" }
        mavenCentral()
    }
    dependencies { classpath "com.github.asbyth:ForgeGradle:6f53277" } // ForgeGradle 2.1, läuft mit neuem Gradle
}
apply plugin: "net.minecraftforge.gradle.forge"

version = "1.0"
group = "de.chunkbug"
archivesBaseName = "ChunkBugAddon"
sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_20"
    makeObfSourceJar = false
}

dependencies {
    compile files("libs/lm_api_mc1.8.9.jar")
}

// LabyMod läuft auf Vanilla-Namen, nicht auf Forge-Namen
reobf { jar { useNotchSrg() } }
